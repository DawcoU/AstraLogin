    success: "&aDaten erfolgreich von &e%old% &atzu &e%new% &atransferiert!"
    error-migration: "&cBeim Speichern der migrierten Dateien ist ein Fehler aufgetreten!"

    new-player-exists: "&cDie neue UUID &6(%uuid%) &cexistiert bereits in der Plugindatenbank!"
    old-player-no-data: "&cSpieler &6%target% &chat keine gespeicherten Daten in diesem Plugin. Nichts zu übertragen!"

    player-not-exists: "&cSpieler &6%target% &chat noch nie auf diesem Server gespielt!"
    player-is-the-same: "&cAlter und neuer Spielername sind identisch!"

    players-online: "&cSpieler &6%old% &cder &6%new% &cist online! &4Sie müssen während der Migration offline sein, um Datenbeschädigungen zu vermeiden!"

    confirm: "&cDiese Aktion ist &4&nUNWIDERRUFLICH&c!"
    button: "&6&l[TRANSFER]"
    hover: "&4Klicke hier, um das Konto zu übertragen"


  # --- Passwort zurücksetzen (/resetpassword) ---
  reset-password:
    usage: "&cKorrekte Verwendung: &e/resetpassword <spieler>"
    no-account: "&cDieser Spieler hat kein registriertes Passwort!"

    admin-success: "&aPasswort für Spieler &6%player% &aerfolgreich zurückgesetzt"

    player-kick: "&cDein Passwort wurde von einem Administrator zurückgesetzt!"


  # --- PIN zurücksetzen (/resetpin) ---
  reset-pin:
    usage: "&cKorrekte Verwendung: &e/resetpin <spieler>"
    no-has-pin: "&cDieser Spieler hat keine registrierte PIN!"

    admin-success: "&aPIN von Spieler &6%player% &aerfolgreich zurückgesetzt"

    player-message: "&cDeine PIN wurde vom Administrator zurückgesetzt!"


  # --- IP zurücksetzen (/resetip) ---
  reset-ip:
    usage: "&cKorrekte Verwendung: &e/resetip <spieler>"
    no-ip: "&cDieser Spieler hat keine gespeicherte IP-Adresse!"

    admin-success: "&aIP-Adresse für Spieler &6%player% &aerfolgreich zurückgesetzt"

    player-kick: "&cDeine IP-Adresse wurde von einem Administrator zurückgesetzt!"


  # --- Konto löschen (/resetaccount) ---
  purge-account:
    usage: "&cKorrekte Verwendung: &e/purgeaccount <spieler>"
    not-found: "&cSpieler &6%target% &cnicht in der Serverdatenbank gefunden"
    admin-success: "&aAlle Kontodaten für Spieler &e%player% &aerfolgreich gelöscht"

    player-kick: "&cDein Konto wurde von einem Administrator vollständig aus der Serverdatenbank entfernt"

    confirm: "&cDiese Aktion ist &4&nUNWIDERRUFLICH&c!"
    button: "&6&l[LÖSCHEN]"
    hover: "&4Klicke hier, um das Konto zu löschen"


  # --- 2FA zurücksetzen (/reset2fa) ---
  reset-twofactor:
    usage: "&cKorrekte Verwendung: &e/reset2fa <spieler>"
    admin-success: "&aZwei-Faktor-Authentifizierung vom Konto des Spielers &e%player% &aerfolgreich entfernt"

    not-found: "&cSpieler &6%target% &chat keine Zwei-Faktor-Authentifizierung (2FA) aktiviert!"

    player-waiting: "&cSpieler &6%target% &cwird derzeit verifiziert!"
    player-setting-up: "&cSpieler &6%target% &crichtet gerade 2FA ein!"
    player-kick: "&cDeine Zwei-Faktor-Authentifizierung wurde von einem Administrator entfernt"


  # --- Anmelde-Spawn-System ---
  spawn:
    set-success: "&aSpawn-Position erfolgreich festgelegt für: &e%type%"
    deleted-success: "&aSpawn-Position erfolgreich entfernt für: &e%type%"

    usage: "&cKorrekte Verwendung: &e/loginspawn <setspawn, delspawn> <before_login, after_login>"
    invalid-type: "&cUngültiger Typ! &eVerwende: before_login oder after_login"
    exists: "&cSpawn für &6%type% &cexistiert bereits!"
    does-not-exist: "&cSpawn für &6%type% &cexistiert nicht!"

    overwrite-button: "&e&l[ÜBERSCHREIBEN]"
    overwrite-hover: "&aKlicke hier, um den Standort für &e%type% &azu überschreiben"
    delete-confirm: "&cBist du sicher, dass du den &6%type% &cSpawn löschen möchtest?"
    delete-button: "&4&l[LÖSCHUNG BESTÄTIGEN]"
    delete-hover: "&aKlicke, um den Spawn dauerhaft zu löschen: &e%type%"


