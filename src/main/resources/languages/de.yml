# Du kannst Farbkoordinaten (z.B. &a, &c, &l), HEX-Codes, Farbverläufe und Platzhalter wie %time%, %player%, %min% verwenden.

messages:

  # --- Allgemein / System ---
  general:
    only-players: "&cDieser Befehl kann nur von Spielern ausgeführt werden!"
    no-permission: "&cDazu hast du keine Berechtigung!"
    reload-success: "&aKonfiguration erfolgreich neu geladen!"
    blocked-action: "&cDu kannst diese Aktion erst ausführen, wenn du dich angemeldet hast!"


  # --- Anmeldung ---
  login:
    server-busy: "&cDer Server verzeichnet derzeit ein hohes Anmeldeaufkommen. Versuche es erneut"
    rate-limit: "&cZu viele Anmeldeversuche! Bitte warte &6%time% &cvor dem nächsten Versuch"

    already-logged: "&cDu bist bereits angemeldet/registriert!"
    already-online: "&cEin Spieler mit diesem Namen ist bereits auf dem Server!"
    wrong-casing: "&cTrete dem Server mit der richtigen Groß- und Kleinschreibung bei!\n&7Richtiger Name: &6%registered%"
    no-account: "&cDu hast kein Konto! Tippe &e/register <passwort, wiederholen>"
    success: "&aErfolgreich angemeldet!"
    reminder: "&eBitte anmelden: &f/login <passwort>"
    usage: "&cKorrekte Verwendung: &e/login <passwort>"
    has-account: "&cDu hast bereits ein Konto! Tippe &e/login <passwort>"


  # --- Registrierung ---
  register:
    success: "&aErfolgreich registriert!"
    reminder: "&eBitte registrieren: &f/register <passwort, wiederholen>"
    usage: "&cKorrekte Verwendung: &e/register <passwort, wiederholen>"


  # --- Premium-Anmeldung ---
  premium:
    success: "&ePremium-&aKonto erkannt, automatisch angemeldet!"


  # --- /forgotpassword ---
  forgot-password:
    usage: "&cKorrekte Verwendung: &e/forgotpassword <PIN>"
    wrong-pin: "&cFalsche PIN!"
    no-has-pin: "&cDu hast keine registrierte PIN!"

    player-kick: "&aDein Passwort wurde erfolgreich zurückgesetzt!"


  # --- Passwörter ---
  password:
    wrong: "&cFalsches Passwort!"
    not-match: "&cDie Passwörter stimmen nicht überein!"
    too-short: "&cDas Passwort ist zu kurz! Mindestens &6%min% &cZeichen"
    too-long: "&cDas Passwort ist zu lang! Maximal &6%max% &cZeichen"
    change-usage: "&cKorrekte Verwendung: &e/changepassword <alt, neu, wiederholen>"
    wrong-old: "&cDas alte Passwort ist falsch!"
    changed-kick: "&aDein Passwort wurde geändert! &eBitte melde dich erneut an"
    changed: "&aDein Passwort wurde erfolgreich geändert!"
    identical: "&cDas neue Passwort darf nicht mit dem alten identisch sein!"
    error: "&cEin kritischer Fehler ist bei der Passwortüberprüfung aufgetreten. Kontaktiere die Administration"
    validation:
      invalid-characters: "&cDein Passwort enthält ungültige Zeichen! Verwende nur Buchstaben, Zahlen und einfache Symbole"
      only-letters-forbidden: "&cDein Passwort darf nicht nur aus Buchstaben bestehen! Füge mindestens eine Zahl oder ein Sonderzeichen hinzu"
      only-digits-forbidden: "&cDein Passwort darf nicht nur aus Zahlen bestehen! Füge mindestens einen Buchstaben oder ein Sonderzeichen hinzu"


  # --- PINs ---
  pin:
    usage: "&cKorrekte Verwendung: &e/pin <setup>"
    set-usage: "&cKorrekte Verwendung: &e/pin <setup, PIN>"
    invalid-length: "&cDie PIN muss genau &6%length% &cZiffern lang sein!"
    contains-letters: "&cDie PIN darf nur Zahlen enthalten!"
    already-set: "&cDu hast bereits eine PIN festgelegt!"
    set-success: "&aPIN-Code erfolgreich generiert, &eSpeichere ihn: &6%pin%"
    typed-success: "&aDein PIN-Code wurde erfolgreich festgelegt!"


  # --- Sicherheit und Sperren ---
  security:
    timeout: "&cDie Anmeldezeit ist abgelaufen!"
    max-attempts: "&cZu viele fehlgeschlagene Anmeldeversuche! Verbleibende Versuche: &6%remaining%"
    max-attempts-ban: "&cZu viele fehlgeschlagene Versuche! Du wurdest für &6%time% &cgesperrt"
    multiaccount: "&cKontolimit für diese IP-Adresse erreicht!"
    ip-spam: "&cZu viele Verbindungsversuche von deiner IP-Adresse! Du bist gesperrt für &6%time%"
    suspicious-ip-alert: "&cVerdächtige Aktivität erkannt! Spieler &4%target% &chat sich von einer unbekannten IP-Adresse angemeldet: &6%ip%"

    security-reminder:
      no-2fa-no-pin:
        - "&c----------------------------------------"
        - "&eDein Konto ist nicht vollständig geschützt!"
        - "&f1. Aktiviere 2FA mit &a/2fa <setup>&f, um Kontodiebstahl zu verhindern"
        - "&f2. Setze eine PIN mit &a/pin <setup>&f, um dein Konto wiederherzustellen, falls du dein Passwort vergisst"
        - "&c----------------------------------------"
      no-2fa-has-pin:
        - "&c----------------------------------------"
        - "&eDein Konto hat noch kein 2FA aktiviert!"
        - "&fErhöhe die Kontosicherheit mit &a/2fa <setup>"
        - "&c----------------------------------------"
      has-2fa-no-pin:
        - "&e----------------------------------------"
        - "&aFast geschafft!"
        - "&fDu hast 2FA aktiviert, aber keine Wiederherstellungs-PIN festgelegt"
        - "&fSetze sie mit &a/pin <setup>&f, um den Zugriff auf dein Konto wiederherstellen zu können"
        - "&e----------------------------------------"


  # --- IP-Vertrauen ---
  ip-trust:
    usage: "&cKorrekte Verwendung: &6/iptrust <reset, info, set, IP-Adresse, Wert>"
    ip-not-found: "&cIP-Adresse nicht gefunden: &6(%ip%)"
    invalid-number: "&cDie Punktzahl darf nur Zahlen enthalten!"
    reset-success: "&aReputation für IP erfolgreich zurückgesetzt: &e(%ip%)"
    set-success: "&aReputation erfolgreich gesetzt: &6(%score%) &afür IP: &e(%ip%)"
    ip-info:
      - "&7&m-------------------------"
      - "&6&lIP-Adress-Reputation (%ip%):"
      - "&eVertrauenswert: &f%score%"
      - "&6Bewertung: %rate%"
      - "&7&m-------------------------"
    rate-fatal: "&0Fatal"
    rate-bad: "&eschlecht"
    rate-neutral: "&7Neutral"
    rate-good: "&aGut"
    rate-ideal: "&bIdeal"


  # --- IP-Verwaltung und Sperren /ipmanager ---
  ip-manager:
    usage: "&cVerwendung: /ipmanager <info, unban, bypass, unbypass, spieler>"
    no-ip: "&cKeine registrierte IP-Adresse für Spieler &6%player% &cgefunden!"
    info-not-banned: "&aSpieler &6%player% &7(IP-Adresse: %ip%) &ahat keine aktive IP-Sperre"
    info-banned: "&cSpieler &6%player% &7(IP-Adresse: %ip%) &cist gesperrt! Grund: &6%reason%&c, Verbleibende Zeit: &6%time%"
    not-banned: "&cIP-Adresse von Spieler &6%player% &cist nicht gesperrt!"
    unban-success: "&aIP-Adresse für Spieler &6%player% &7(%ip%) &aerfolgreich entsperrt!"
    bypass-enabled: "&aIP-Prüfungs-Bypass für Spieler &6%player% &awurde aktiviert"
    bypass-active: "&cIP-Bypass für Spieler &6%player% &cist bereits aktiviert!"
    bypass-disabled: "&cIP-Prüfungs-Bypass für Spieler &6%player% &cwurde deaktiviert"
    bypass-not-active: "&cIP-Bypass für Spieler &6%player% &cist bereits deaktiviert!"


  # --- Sitzungen ---
  session:
    timer: "&eBitte melde dich innerhalb von &6%time% &ean!"
    restored: "&eSitzung aktiv. Automatisch angemeldet!"
    twofactor-expired: "&cDeine 2FA-Sitzung ist abgelaufen! Bitte gib den Code ein"


  # --- Titel ---
  title:
    login: "&a&lANGEMELDET"
    login-subtitle: "&7Willkommen zurück!"
    register: "&a&lREGISTRIERT"
    register-subtitle: "&7Willkommen auf dem Server!"
    twofactor: "&b&l2FA"


  # --- Zwei-Faktor-Authentifizierung (2FA) ---
  twofactor:
    usage: "&cKorrekte Verwendung: &6/2fa <setup, unsetup, code>"
    already-enabled: "&cDu hast 2FA bereits aktiviert!"
    not-enabled: "&cDu hast 2FA nicht aktiviert!"

    setup-instructions:
      - "&7&m-------------------------"
      - "&6&l2FA - Einrichtung"
      - "&eGeheimer Schlüssel: &f%secret%"
      - "&eGib den Code in deiner App ein und tippe dann: &6/2fa <codevalue>"
      - "&7&m-------------------------"

    setup-backup-codes:
      - "&eBackup-Codes:"
      - "&7- &f%codes%"
      - "&6Verwende einen davon, falls du den Zugriff auf deine Authenticator-App verlierst!"
      - "&7&m-------------------------"

    setup-timer: "&aVerbleibende Zeit für die Einrichtung: &e%seconds%"
    expired: "&cDie Verifizierungszeit ist abgelaufen!"
    setup-already-active: "&cDu richtest 2FA bereits ein!"
    not-in-setup: "&cDu bist derzeit nicht dabei, 2FA einzurichten oder zu entfernen"

    success: "&a2FA-Schutz wurde erfolgreich aktiviert!"
    removed-success: "&a2FA wurde erfolgreich entfernt!"

    wrong-code: "&cFalscher 2FA-Code!"
    required: "&eGib den Code aus deiner App ein: &6/2fa <codevalue>"
    not-needed: "&cDu musst im Moment keinen 2FA-Code eingeben"

    unsetup-instructions: "&cUm 2FA zu deaktivieren, gib den Code ein: /2fa unsetup <codevalue>"


  # --- Kontoinfo-Befehl (/account) ---
  account:
    usage: "&cKorrekte Verwendung: &e/account <spieler>"
    not-found: "&cSpieler &6%target% &chat sich noch nie auf diesem Server registriert"
    no-data: "Keine Daten"
    logout-success: "&aErfolgreich abgemeldet"

    stats:
      header: "&8--- &6Konto-Statistiken: &e%target% &8---"
      uuid: "&7UUID: &f%uuid%"
      ip: "&7Letzte IP-Adresse: &f%ip%"
      register-date: "&7Registrierungsdatum: &f%register_date%"
      login-date: "&7Letzte Anmeldung: &f%login_date%"
      status-2fa: "&72FA-Status: %status%"
      footer: "&8--------------------------------"

    status:
      not-registered: "&cUnregistriert"
      active-2fa: "&aAktiviert"
      not-active-2fa: "&cDeaktiviert"


  # --- Kontenliste-Befehl (/accountslist) ---
  accounts-list:
    generating: "&7Lade Liste der registrierten Konten..."
    empty: "&cDie Kontodatenbank ist leer"
    header: "&7===== &6Registrierte Konten &7====="
    format: "&7- &e%name% &7(&aUUID: &b%uuid%&7)"
    footer: "&7======================================="


  # --- IP-Liste-Befehl (/iplist) ---
  ip-list:
    generating: "&7Lade IP-Liste..."
    empty: "&cDie IP-Adressdatenbank ist leer"
    header: "&7===== &6Registrierte IP-Adressen &7====="
    format: "&e%ip% &b(&6Konten: %count%&b) &7-> &a%players%"
    footer: "&7==========================================="


