# You can use color codes (e.g., &a, &c, &l), HEX codes, gradients, and placeholders like %time%, %player%, %min%.

messages:

  # --- General / System ---
  general:
    only-players: "&cThis command can only be executed by players!"
    no-permission: "&cYou do not have permission!"
    reload-success: "&aPlugin reloaded successfully!"
    blocked-action: "&cYou cannot perform this action until you log in!"
    player-not-found: "&cPlayer &6%target% &cdoes not exist in the server database!"


  # --- Login ---
  login:
    server-busy: "&cThe server is currently experiencing heavy login traffic. Please try again in a moment!"
    rate-limit: "&cToo many login attempts! Please wait &6%time% &cbefore trying again."

    already-logged: "&cYou are already logged in or registered!"
    already-online: "&cA player with this name is already on the server!"
    wrong-casing: "&cJoin the server using the correct case!\n&7Correct nickname: &6%registered%"
    no-account: "&cYou do not have an account! Type &e/register <password, repeat>"
    success: "&aSuccessfully logged in!"
    reminder: "&ePlease log in: &f/login <password>"
    usage: "&cCorrect usage: &e/login <password>"
    has-account: "&cYou already have an account! Type &e/login <password>"


  # --- Register ---
  register:
    success: "&aSuccessfully registered!"
    reminder: "&ePlease register: &f/register <password, repeat>"
    usage: "&cCorrect usage: &e/register <password, repeat>"


  # --- Premium Login ---
  premium:
    success: "&ePremium &aaccount detected. Logged in automatically!"


  # --- /forgotpass ---
  forgot-password:
    usage: "&cCorrect usage: &e/forgotpass <PIN>"
    wrong-pin: "&cWrong PIN!"
    no-has-pin: "&cYou do not have a registered PIN!"

    player:
      kick: "&aYour password has been successfully reset!"


  # --- Passwords ---
  password:
    wrong: "&cIncorrect password!"
    not-match: "&cPasswords do not match!"
    too-short: "&cPassword is too short! Minimum &6%min% &ccharacters"
    too-long: "&cPassword is too long! Maximum &6%max% &ccharacters"
    change-usage: "&cCorrect usage: &e/changepass <old, new, repeat>"
    wrong-old: "&cOld password is incorrect!"
    changed-kick: "&aYour password has been changed! &ePlease log in again"
    changed: "&aYour password has been successfully changed!"
    identical: "&cThe new password cannot be the same as the old one!"
    error: "&cA critical error occurred while verifying your password. Contact administration"
    validation:
      invalid-characters: "&cYour password contains invalid characters! Use only letters, digits, and basic symbols"
      only-letters-forbidden: "&cYour password cannot consist only of letters! Include at least one digit or special character"
      only-digits-forbidden: "&cYour password cannot consist only of digits! Include at least one letter or special character"


  # --- PINs ---
  pin:
    usage: "&cCorrect usage: &e/pin <setup>"
    set-usage: "&cCorrect usage: &e/pin <setup, PIN>"
    invalid-length: "&cPIN must be exactly &6%length% &cdigits long!"
    contains-letters: "&cPIN can only contain numbers!"
    already-set: "&cYou already have a PIN set!"
    set-success: "&aPIN code successfully generated, &eSave it: &6%pin%"
    typed-success: "&aYour PIN code has been successfully set!"


  # --- Security and Bans ---
  security:
    timeout: "&cLogin time has expired!"
    attempts:
      exceeded: "&cToo many failed login attempts! Remaining attempts: &6%remaining%"
      ban: "&cToo many failed login attempts! You have been banned for &6%time%"
    multiaccount: "&cAccount limit for this IP address has been reached!"
    ip-spam: "&cToo many connection attempts from your IP address! You are blocked for &6%time%"
    suspicious-ip-alert: "&cSuspicious activity detected! Player &4%target% &cjoined from an unknown IP address: &6%ip%"

    reminders:
      no-2fa-no-pin:
        - "&7&m----------------------------------------"
        - "&eYour account is not fully secured!"
        - "&f1. Enable 2FA using &a/2fa <setup>&f to prevent account theft"
        - "&f2. Set a PIN using &a/pin <setup>&f to recover your account if you forget your password"
        - "&7&m----------------------------------------"
      no-2fa-has-pin:
        - "&7&m----------------------------------------"
        - "&eYour account does not have 2FA enabled yet!"
        - "&fIncrease your account security using &a/2fa <setup>"
        - "&7&m----------------------------------------"
      has-2fa-no-pin:
        - "&7&m----------------------------------------"
        - "&aAlmost there!"
        - "&fYou have 2FA enabled, but you haven't set a recovery PIN"
        - "&fSet it using &a/pin <setup>&f so you can recover access to your account"
        - "&7&m----------------------------------------"


  # --- Captcha (Bot Protection) ---
  captcha:
    success: "&a✔ Captcha completed successfully!"
    required: "&cYou must complete the captcha before logging in!"
    attempts:
      exceeded: "&cToo many failed captcha attempts! Remaining attempts: &6%remaining%"
      ban: "&cToo many failed captcha attempts! You have been banned for &6%time%"
    timer: "&eSolve the captcha within &6%time%&e!"
    timeout: "&cTime to solve the captcha has expired!"
    modes:
      gui:
        title: "&6Captcha"
        wrong-choice: "&c✖ Incorrect choice! Attempt &6%attempts%&c/&6%max%&c. Try again."
        prompts:
          edible: "&8- &eClick an edible item"
          red: "&8- &eClick red"
          blue: "&8- &eClick blue"
          green: "&8- &eClick green"
          yellow: "&8- &eClick yellow"
          wood: "&8- &eClick wood"
          bow_ammo: "&8- &eClick arrows"
          chicken_drop: "&8- &eClick a chicken drop"
          redstone: "&8- &eClick redstone"
          ore: "&8- &eClick ore"
          helmet: "&8- &eClick a helmet"
          netherite: "&8- &eClick netherite"
          potion: "&8- &eClick a potion"
          music_disc: "&8- &eClick a music disc"
          boat: "&8- &eClick a boat"
          tool: "&8- &eClick a tool"
      map:
        instruction: "&eType the code shown on the map in your hand in chat!"
        item-name: "&6Captcha Map"
        wrong-code: "&c✖ Incorrect code! Attempt &6%attempts%&c/&6%max%&c. Try again."
      chat:
        instruction: "&eSolve the math puzzle: &6%equation%"
        wrong-answer: "&c✖ Incorrect answer! Attempt &6%attempts%&c/&6%max%&c. Try again."


  # --- IP Trust ---
  ip-trust:
    usage: "&cCorrect usage: &6/iptrust <reset, info, set, IP address, score>"
    ip-not-found: "&cIP address not found: &6(%ip%)"
    invalid-number: "&cThe point value can contain digits only!"
    reset-success: "&aSuccessfully reset reputation for IP: &e(%ip%)"
    set-success: "&aSuccessfully set reputation: &6(%score%) &afor IP: &e(%ip%)"
    ip-info:
      - "&7&m-------------------------"
      - "&6&lIP Address Reputation (%ip%):"
      - "&eTrust score: &f%score%"
      - "&6Rating: %rate%"
      - "&7&m-------------------------"
    rate-fatal: "&0Fatal"
    rate-bad: "&cBad"
    rate-neutral: "&7Neutral"
    rate-good: "&aGood"
    rate-ideal: "&bIdeal"


  # --- IP Management and Bans /ipmanager ---
  ip-manager:
    usage: "&cUsage: /ipmanager <info, unban, bypass, unbypass, player>"
    no-ip: "&cNo registered IP address found for player &6%player%&c!"

    info:
      not-banned: "&aPlayer &6%player% &7(IP address: %ip%) &adoes not have an active IP ban."
      banned: "&cPlayer &6%player% &7(IP address: %ip%) &cis banned! Reason: &6%reason%&c. Time remaining: &6%time%"

    unban:
      not-banned: "&cIP address for player &6%player% &cis not banned!"
      success: "&aSuccessfully unbanned IP address for player &6%player% &7(%ip%)&a!"

    bypass:
      enabled: "&aEnabled IP address check bypass for player &6%player%"
      already-enabled: "&cIP address check bypass for player &6%player% &cis already enabled!"
      disabled: "&cDisabled IP address check bypass for player &6%player%"
      already-disabled: "&cIP address check bypass for player &6%player% &cis already disabled!"


  # --- Sessions ---
  session:
    timer: "&ePlease log in within &6%time%&e!"
    restored: "&aSession restored. You have been logged in automatically!"
    twofactor-expired: "&cYour 2FA session has expired! Please enter the code"


  # --- Titles ---
  title:
    login: "&a&lLOGGED IN"
    login-subtitle: "&7Welcome back!"
    register: "&a&lREGISTERED"
    register-subtitle: "&7Welcome to the server!"
    twofactor: "&b&l2FA"


  # --- Two-Factor Authentication 2FA ---
  twofactor:
    required: "&eEnter code from application: &6/2fa <code>"
    usage: "&cCorrect usage: &6/2fa <setup, unsetup, code>"
    setup-method-usage: "&cCorrect usage: &6/2fa setup <totp, mail>"
    already-enabled: "&c2FA protection is already enabled!"
    not-enabled: "&c2FA protection is not enabled!"
    not-needed: "&cYou do not need to enter a 2FA code right now!"
    setup-already-active: "&cYou are already setting up 2FA!"
    expired: "&cVerification time has expired!"
    setup-timer: "&aTime for setup: &e%seconds%"
    wrong-code: "&cIncorrect 2FA code!"
    success: "&a2FA protection successfully enabled!"
    removed-success: "&a2FA successfully removed!"

    setup:
      instructions:
        - "&7&m-------------------------"
        - "&6&l2FA - TOTP Setup"
        - "&eKey: &f%secret%"
        - "&eEnter code in app, then: &6/2fa <code>"
        - "&7&m-------------------------"
      backup-codes:
        - "&eBackup codes:"
        - "&7- &f%codes%"
        - "&6Use one of these if you lose access to the app!"
        - "&7&m-------------------------"

    mail:
      not-configured: "&cEmail sending is not configured!"
      not-set: "&cYou do not have an email address set! Use &6/mail set <address>"
      send-failed: "&cFailed to send code to email address!"
      save-failed: "&cFailed to save the MAIL 2FA configuration!"
      code-expired: "&cEmail code expired or attempt limit exceeded!"
      setup-instructions:
        - "&7&m-------------------------"
        - "&6&l2FA - MAIL Setup"
        - "&eCode has been sent to: &f%email%"
        - "&eEnter it using: &6/2fa <code>"
        - "&7&m-------------------------"
      setup-code-sent: "&aVerification code has been sent to &f%email%"

    login:
      code-expired: "&cYour login code has expired. Use &6/2fa &cto request a new one."
      code-pending: "&eLogin code has already been sent. Check your inbox!"
      code-sent: "&aLogin code has been sent to &f%email%"

    unsetup:
      instructions: "&cTo disable 2FA, enter the code: &6/2fa unsetup <code>"
      mail-required: "&cFirst request a 2FA disable code using &6/2fa unsetup"
      code-pending: "&e2FA disable code has already been sent. Check your inbox!"
      code-sent: "&a2FA disable code has been sent to &f%email%"


  # --- Email address ---
  mail:
    usage: "&cCorrect usage: &6/mail <set, del>"
    invalid-address: "&cThe specified email address is invalid!"
    set-success: "&aEmail address successfully set to: &f%email%"
    already-set: "&cEmail address is already set!"
    not-set: "&cYou do not have an email address set!"
    mail-2fa-active: "&cDisable MAIL 2FA protection first!"
    setup-active: "&cYou cannot change email address during 2FA setup!"
    deleted: "&aEmail address successfully deleted!"
    deleted-mail-disabled: "&aEmail address deleted and MAIL 2FA protection disabled!"

    delete:
      confirm: "&cAre you sure you want to delete email address &6%email%&c?"
      button: "&4&l[DELETE]"
      hover: "&aClick to delete email address: &e%email%"


  # --- Account Info Command (/account) ---
  account:
    usage: "&cCorrect usage: &e/account <player>"
    no-data: "&7No data"
    logout-success: "&aSuccessfully logged out!"

    stats:
      header: "&8--- &6Account Statistics: &e%target% &8---"
      uuid: "&7UUID: &f%uuid%"
      ip: "&7Last IP address: &f%ip%"
      register-date: "&7Registration date: &f%register_date%"
      login-date: "&7Last login: &f%login_date%"
      status-2fa: "&72FA Status: %status%"
      footer: "&8--------------------------------"

    status:
      not-registered: "&cUnregistered"
      active-2fa: "&aEnabled"
      not-active-2fa: "&cDisabled"


  # --- Accounts List Command (/accountslist) ---
  accounts-list:
    generating: "&7Loading registered accounts list..."
    empty: "&cThe account database is empty"
    header: "&7===== &6Registered accounts &7====="
    format: "&7- &e%name% &7(&aUUID: &b%uuid%&7)"
    footer: "&7======================================="


  # --- IP List Command (/iplist) ---
  ip-list:
    generating: "&7Loading IP address list..."
    empty: "&cThe IP address database is empty"
    header: "&7===== &6Registered IP addresses &7====="
    format: "&e%ip% &b(&6Accounts: %count%&b) &7-> &a%players%"
    footer: "&7==========================================="


  # --- Move Account Command (/moveaccount) ---
  account-move:
    usage: "&cCorrect usage: &e/moveaccount <old name, new name>"
    start: "&aStarting verification and migration process for &e%old% &a--> &e%new%"

    success: "&aSuccessfully transferred data from &e%old% &ato &e%new%&a!"
    error-migration: "&cAn error occurred while saving the migrated files!"

    new-player-exists: "&cThe new UUID &6(%uuid%) &calready exists in the plugin database!"
    old-player-no-data: "&cPlayer &6%target% &chas no data saved in this plugin. Nothing to transfer!"

    player-same: "&cThe old and new player nicknames are identical!"

    players-online: "&cPlayer &6%old% &cor &6%new% &cis online! &4Both must be offline during migration to prevent data corruption!"

    confirm: "&cThis action is &4&nIRREVERSIBLE&c!"
    button: "&6&l[TRANSFER]"
    hover: "&4Click here to transfer the account"


  # --- Reset Password (/resetpass) ---
  reset-password:
    usage: "&cCorrect usage: &e/resetpass <player>"
    no-account: "&cPlayer &6%player% &cdoes not have a registered account!"

    admin:
      success: "&aPassword for player &6%player% &ahas been successfully reset"

    player:
      kick: "&cYour password has been reset by an administrator!"


  # --- PIN Reset /resetpin ---
  reset-pin:
    usage: "&cCorrect usage: &e/resetpin <player>"
    no-has-pin: "&cThis player does not have a registered PIN!"

    admin:
      success: "&aSuccessfully reset the PIN for player &6%player%&a!"

    player:
      message: "&cYour PIN has been reset by the administrator!"


  # --- Reset Email /resetmail ---
  reset-email:
    usage: "&cCorrect usage: &e/resetmail <player>"
    no-email: "&cThis player does not have an assigned email address!"
    admin:
      success: "&aSuccessfully reset the email address for player &6%player%!"
    player:
      message: "&cAn administrator has reset your email address. You can set a new one."


  # --- Reset IP (/resetip) ---
  reset-ip:
    usage: "&cCorrect usage: &e/resetip <player>"
    no-ip: "&cThis player does not have a saved IP address!"

    admin:
      success: "&aIP address for player &6%player% &ahas been successfully reset"

    player:
      kick: "&cYour IP address has been reset by an administrator!"


  # --- Purge Account (/resetaccount) ---
  purge-account:
    usage: "&cCorrect usage: &e/resetaccount <player>"
    admin:
      success: "&aSuccessfully deleted all account data for player &e%player%!"

    player:
      kick: "&cYour account has been completely removed from the server database by an administrator"

    confirm: "&cThis action is &4&nIRREVERSIBLE&c!"
    button: "&6&l[DELETE]"
    hover: "&4Click here to delete the account"


  # --- Reset 2FA (/reset2fa) ---
  reset-twofactor:
    usage: "&cCorrect usage: &e/reset2fa <player>"

    admin:
      success: "&aSuccessfully removed two-factor authentication from player &e%player%&a!"

    target:
      not-enabled: "&cPlayer &6%target% &cdoes not have two-factor authentication (2FA) enabled!"
      waiting: "&cPlayer &6%target% &cis currently being verified!"
      setting-up: "&cPlayer &6%target% &cis currently setting up 2FA!"

    player:
      kick: "&cYour two-factor authentication has been removed by an administrator"


  # --- Login spawn system ---
  spawn:
    set-success: "&aSuccessfully set the location for: &e%type%"

    usage: "&cUsage: &e/loginspawn <setspawn, delspawn> <before_login, after_login>"
    invalid-type: "&cInvalid type! &eUse: before_login or after_login"
    exists: "&cSpawn &6%type% &calready exists!"
    does-not-exist: "&cSpawn &6%type% &cdoes not exist!"

    overwrite:
      button: "&e&l[REPLACE]"
      hover: "&aClick here to force overwrite the location for: &e%type%"

    delete:
      success: "&aDeleted spawn location: &e%type%"
      confirm: "&cAre you sure you want to delete spawn &6%type%&c?"
      button: "&4&l[DELETE]"
      hover: "&aClick to permanently delete the spawn: &e%type%"


  # --- Seasonal Events ---
  seasonal-events:
    halloween:
      - "&6[Halloween] &cShadows of the past are watching your every &4step..."
      - "&6[Halloween] &cSomething terrifying lurks in the darkness... &4Run!"
      - "&6[Halloween] &cTrick or treat? There is no &4escape &ctoday!"
      - "&6[Halloween] &cDo you hear those quiet whispers behind your &4back?"
      - "&6[Halloween] &cThe night has just begun, and your &4fate &cis already sealed..."
    christmas:
      - "&b[Christmas] &fSnow is falling outside, and holiday magic fills the whole &3world!"
      - "&b[Christmas] &fMay this special time bring you lots of joy and &3happiness!"
      - "&b[Christmas] &fBells are already ringing, and festive spirit reaches even the farthest corners of the &3server!"
      - "&b[Christmas] &fSanta is preparing gifts, and what about you? Don't forget the holiday &3fun!"
      - "&b[Christmas] &fThe year is slowly coming to an end... May the upcoming New Year be full of &3adventures!"


  # --- Update System ---
  update:
    in-progress: "&cChecking for updates is already in progress..."
    api-error: "&cFailed to connect to the Modrinth API"
    no-versions: "&cNo published versions were found"
    up-to-date: "&aAstraLogin is already up to date"
    local-newer: "&eThe installed version is newer than the latest version published on Modrinth. Update skipped."
    no-files: "&cNo downloadable file was found for the latest version"
    directory-error: "&cFailed to create the update directory"
    download-error: "&cFailed to download the update"
    downloaded: "&aAstraLogin update downloaded successfully"
    restart-required: "&eRestart the server to apply the update"
    failed: "&cAn error occurred while checking for updates or downloading the file."