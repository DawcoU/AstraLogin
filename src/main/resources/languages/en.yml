# #############################################################
# #                                                           #
# #                AstraLogin - Language File                 #
# #                   Language: English (EN)                  #
# #                                                           #
# #############################################################

# You can use color codes (e.g., &a, &c, &l), HEX codes, gradients, and placeholders like %time%, %player%, %min%.

messages:

  # --- General / System ---
  general:
    only-players: "&cThis command can only be executed by players!"
    no-permission: "&cYou do not have permission!"
    reload-success: "&aConfiguration reloaded successfully!"
    blocked-action: "&cYou cannot perform this action until you log in!"


  # --- Login ---
  login:
    already-logged: "&cYou are already logged in/registered!"
    no-account: "&cYou do not have an account! Type &e/register <password> <repeat>"
    success: "&aSuccessfully logged in!"
    reminder: "&ePlease log in: &f/login <password>"
    usage: "&cCorrect usage: &e/login <password>"
    has-account: "&cYou already have an account! Type &e/login <password>"
    already-online: "&cA player with this nickname is already on the server!"


  # --- Register ---
  register:
    success: "&aSuccessfully registered!"
    reminder: "&ePlease register: &f/register <password> <repeat>"
    usage: "&cCorrect usage: &e/register <password> <repeat>"


  # --- Premium Login ---
  premium:
    success: "&aPremium account detected, logged in automatically!"


  # --- Passwords ---
  password:
    wrong: "&cIncorrect password!"
    not-match: "&cPasswords do not match!"
    too-short: "&cPassword is too short! Minimum &6%min% &ccharacters"
    too-long: "&cPassword is too long! Maximum &6%max% &ccharacters"
    change-usage: "&cCorrect usage: &e/changepassword <old> <new> <repeat>"
    wrong-old: "&cOld password is incorrect!"
    changed-kick: "&aYour password has been changed! &ePlease log in again"
    changed: "&aYour password has been successfully changed!"
    identical: "&cThe new password cannot be the same as the old one!"


  # --- Security and Bans ---
  security:
    timeout: "&cLogin time has expired!"
    max-attempts: "&cToo many failed login attempts! Remaining attempts: &6%remaining%"
    max-attempts-ban: "&cToo many failed attempts! You have been banned for &6%time%"
    multiaccount: "&cAccount limit for this IP address has been reached!"
    ip-spam: "&cToo many connection attempts from your IP! You have been blocked for &6%time%"
    ip-mismatch: "&cYour IP address does not match this account!"


  # --- IP Trust ---
  ip-trust:
    usage: "&cCorrect usage: &6/iptrust reset, info, set | <IP> | <score>"
    ip-not-found: "&cIP address not found: &6(%ip%)"
    invalid-number: "&cThe amount of points can only contain numbers!"
    reset-success: "&aSuccessfully reset reputation for IP: &e(%ip%)"
    set-success: "&aSuccessfully set reputation: &6(%score%) &afor IP: &e(%ip%)"
    ip-info:
      - "&7&m-------------------------"
      - "&6&lIP Reputation (%ip%):"
      - "&eTrust Score: &f%score%"
      - "&6Rating: %rate%"
      - "&7&m-------------------------"
    rate-fatal: "&0Fatal"
    rate-bad: "&cBad"
    rate-neutral: "&7Neutral"
    rate-good: "&aGood"
    rate-ideal: "&bIdeal"


  # --- Sessions ---
  session:
    timer: "&ePlease log in within &6%time%&e!"
    restored: "&eSession active. Logged in automatically!"
    twofactor-expired: "&cYour 2FA session has expired! Please enter the code"


  # --- Titles ---
  title:
    login: "&a&lLOGGED IN"
    login-subtitle: "&7Welcome back!"
    register: "&a&lREGISTERED"
    register-subtitle: "&7Welcome to the server!"
    twofactor: "&b&l2FA"


  # --- Two-Factor Authentication (2FA) ---
  twofactor:
    usage: "&cCorrect usage: &6/2fa setup, next, unsetup, confirm | <code>"
    already-enabled: "&cYou already have 2FA enabled!"
    not-enabled: "&cYou do not have 2FA enabled!"

    setup-instructions:
      - "&7&m-------------------------"
      - "&6&l2FA - Setup"
      - "&eSecret Key: &f%secret%"
      - "&eEnter the code in your app, then type: &6/2fa <code>"
      - "&7&m-------------------------"

    setup-backup-codes:
      - "&eBackup Codes:"
      - "&7- &f%codes%"
      - "&6Use one of these if you lose access to your authenticator app!"
      - "&7&m-------------------------"

    setup-timer: "&aTime remaining for setup: &e%seconds%s"
    expired: "&cVerification time has expired!"
    setup-already-active: "&cYou are already setting up 2FA!"
    not-in-setup: "&cYou are not currently setting up or removing 2FA"

    success: "&a2FA protection has been successfully enabled!"
    removed-success: "&a2FA has been successfully removed!"

    wrong-code: "&cIncorrect 2FA code!"
    required: "&eEnter the code from your app: &6/2fa <code>"
    not-needed: "&cYou do not need to enter a 2FA code right now"

    unsetup-instructions: "&cAby disable 2FA, enter the code: /2fa unsetup <code>"


  # --- Account Info Command (/konto) ---
  account:
    usage: "&cCorrect usage: &e/account <player>"
    not-found: "&cPlayer &6%target% &chas never registered on this server"
    no-data: "No data"
    logout-success: "&aLogged Out Successfully"

    stats:
      header: "&8--- &6Account Statistics: &e%target% &8---"
      uuid: "&7UUID: &f%uuid%"
      ip: "&7Last IP: &f%ip%"
      register-date: "&7Registration Date: &f%register_date%"
      login-date: "&7Last Login: &f%login_date%"
      status-2fa: "&72FA Status: %status%"
      footer: "&8--------------------------------"

    status:
      not-active-register: "&cUnregistered"
      active-2fa: "&aEnabled"
      not-active-2fa: "&cDisabled"


  # --- Accounts List Command (/kontalista) ---
  accounts-list:
    generating: "&7Loading registered accounts list..."
    empty: "&cThe account database is empty"
    header: "&7===== &6Registered Accounts &7====="
    format: "&7- &e%name% &7(&aUUID: &b%uuid%&7)"
    footer: "&7======================================="


  # --- IP List Command (/listaip) ---
  ip-list:
    generating: "&7Loading IP List..."
    empty: "&cThe IP address database is empty"
    header: "&7===== &6Registered IPs &7====="
    format: "&e%ip% &b(&6Accounts: %count%&b) &7-> &a%players%"
    footer: "&7==========================================="


  # --- Move Account Command (/przenieskonto) ---
  account-move:
    usage: "&cCorrect usage: &e/moveaccount <old nick> <new nick>"

    start: "&aStarting verification and migration process for &e%old% &a--> &e%new%"

    success: "&aSuccessfully transferred data from &e%old% &ato &e%new%&a!"

    error-migration: "§cAn error occurred while saving the migrated files!"

    new-player-exists: "§cThe new UUID &6(%uuid%) &calready exists in the plugin database!"

    old-player-no-data: "&cPlayer &6%target% &chas no data saved in this plugin. Nothing to transfer!"

    player-not-exists: "&cPlayer &6%target% &chas never played on this server!"

    player-is-the-same: "&cThe old and new player nicknames are identical!"

    players-online:
      "&cPlayer &6%old% &cor &6%new% &cis online! &4They must be offline during migration to prevent data corruption!"

    confirm: "&cThis action is &4&nIRREVERSIBLE&c!"
    button: "&6&l[TRANSFER]"
    hover: "&4Click here to transfer the account"


  # --- Reset Password (/zresetujhaslo) ---
  reset-password:
    usage: "&cCorrect usage: &e/resetpassword <player>"
    no-account: "&cThis player does not have a registered password!"

    admin-success: "&aPassword for player &6%player% &ahas been successfully reset"

    player-kick: "&cYour password has been reset by an administrator!"


  # --- Reset IP (/zresetujip) ---
  reset-ip:
    usage: "&cCorrect usage: &e/resetip <player>"
    no-ip: "&cThis player does not have a saved IP address!"

    admin-success: "&aIP address for player &6%player% &ahas been successfully reset"

    player-kick: "&cYour IP address has been reset by an administrator!"


  # --- Purge Account (/zresetujkonto) ---
  purge-account:
    usage: "&cCorrect usage: &e/purgeaccount <player>"

    admin-success: "&aSuccessfully purged ALL account data for player &e%player%"

    player-kick: "&cYour account has been completely removed from the server database by an administrator"

    confirm: "&cThis action is &4&nIRREVERSIBLE&c!"
    button: "&6&l[DELETE]"
    hover: "&4Click here to delete the account"


  # --- Reset 2FA (/zresetuj2fa) ---
  reset-twofactor:
    usage: "&cCorrect usage: &e/reset2fa <player>"

    admin-success: "&aSuccessfully removed two-factor authentication from &e%player%'s account"

    not-found: "&cPlayer &6%target% &cdoes not have two-factor authentication (2FA) enabled!"

    player-waiting: "&cPlayer &6%target% &cis currently undergoing verification!"

    player-setting-up: "&cPlayer &6%target% &cis currently setting up 2FA!"

    player-kick: "&cYour two-factor authentication has been removed by an administrator"


  # --- Login Spawn System ---
  spawn:
    set-success: "&aSuccessfully set spawn location for: &e%type%"

    deleted-success: "&aSuccessfully removed spawn location for: &e%type%"

    login-usage: "&cCorrect usage: &e/loginspawn <setspawn|delspawn> <before_login|after_login>"

    usage: "&cCorrect usage: &e/loginspawn %cmd% <before_login|after_login>"

    invalid-type: "&cInvalid type! &eUse: before_login or after_login"

    exists: "&cSpawn for &6%type% &calready exists!"

    does-not-exist: "&cSpawn for &6%type% &cdoes not exist!"

    overwrite-button: "&e&l[OVERWRITE]"

    overwrite-hover: "&aClick here to force overwrite the location for: &e%type%"

    delete-confirm: "&cAre you sure you want to delete the &6%type% &cspawn?"

    delete-button: "&4&l[CONFIRM DELETE]"

    delete-hover: "&aClick to permanently delete the spawn: &e%type%"