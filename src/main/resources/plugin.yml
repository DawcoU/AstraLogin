name: AstraLogin
version: '${version}'
main: pl.dawcou.astralogin.AstraLogin
api-version: '1.18'
load: POSTWORLD

commands:
  astralogin:
    aliases: [al]
  zresetujhaslo:
    aliases: [resetpassword]
  zmienhaslo:
    aliases: [changepassword]
  zresetujip:
    aliases: [resetip]
  zaloguj:
    aliases: [login, l]
  zarejestruj:
    aliases: [register, reg]
  konto:
    aliases: [account]
  zresetujkonto:
    aliases: [resetaccount]
  zresetuj2fa:
    aliases: [reset2fa]
  listaip:
    aliases: [iplist]
  listakont:
    aliases: [accountslist]
  2fa:
    aliases: [tfa, auth]

permissions:
  astralogin.reload:
    default: op
  astralogin.update:
    default: op
  astralogin.spawn:
    default: op
  astralogin.resetpassword:
    default: op
  astralogin.resetip:
    default: op
  astralogin.resetaccount:
    default: op
  astralogin.reset2fa:
    default: op
  astralogin.account:
    default: op
  astralogin.iplist:
    default: op
  astralogin.accountslist:
    default: op